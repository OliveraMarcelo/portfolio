# Cabeceras de seguridad, en un archivo aparte por una razon concreta de nginx:
# `add_header` NO SE HEREDA en un bloque anidado que declare su propio
# `add_header`. Con las cabeceras solo a nivel de server, cualquier `location`
# que agregue un Cache-Control las borraba todas.
#
# Medido antes de desplegar, sirviendo la imagen de produccion:
#   /index.html          -> solo Cache-Control. Sin CSP, sin HSTS, sin nada.
#   /js/chunk-vendors.js -> solo Cache-Control.
#   /projects            -> ninguna, porque try_files cae en /index.html.
#
# O sea que la CSP y el HSTS no se aplicaban a practicamente ninguna respuesta.
# Con el include repetido en cada bloque, se aplican a todas.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Viable porque el sitio no pide nada a ningun host externo (D14): se fueron
# Google Fonts, el worker de PDF.js y Font Awesome.
#
# Los dos 'unsafe-inline' son necesarios y no un descuido: el de script-src por
# el script inline de tema e idioma que corre antes del primer pintado (D2), y
# el de style-src por los estilos inline que Vue emite. Sin ellos el sitio se
# rompe.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
