<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MarceCode">
  <!-- El favicon anterior usaba #1a1a2e y #7c3aed, dos colores que no
       pertenecen a ninguna paleta del proyecto. Estos son los tokens reales:
       --color-bg del tema oscuro y --color-accent.

       El glifo es el mismo `i-code` del sprite, como trazo y no como texto:
       rasterizado a 16px, un <text> depende de la fuente que tenga el sistema
       y el resultado cambia de maquina en maquina. -->
  <rect width="100" height="100" rx="22" fill="#0B0D10"/>
  <g transform="translate(50 50) scale(3.1) translate(-12 -12)"
     fill="none" stroke="#FF7948" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 7.5 4 12l4.5 4.5M15.5 7.5 20 12l-4.5 4.5M13.5 5l-3 14"/>
  </g>
</svg>
