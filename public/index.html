<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- Tema e idioma antes del primer pintado. Va ANTES de toda hoja de
         estilo y sin defer ni async: tiene que bloquear. Si el tema se
         aplicara al montar la app, todo visitante con preferencia clara veria
         un destello oscuro, y ese destello cuenta como cambio de layout
         percibido.

         El try/catch no es decorativo: en modo privado de Safari el mero
         acceso a localStorage LANZA, y una excepcion en un script bloqueante
         dejaria la pagina sin tema y sin aplicacion.

         Las claves `mc-theme` y `mc-lang` tienen que ser IDENTICAS a las de
         useTheme.js y useLocale.js. Si divergen, el sintoma es un destello en
         cada carga sin ningun error en consola. -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null, l = null;
        try {
          t = localStorage.getItem('mc-theme');
          l = localStorage.getItem('mc-lang');
        } catch (e) { /* noop */ }

        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (l !== 'es' && l !== 'en') l = 'es';

        d.setAttribute('data-theme', t);
        d.setAttribute('lang', l);
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!-- Fuentes del hero, precargadas. `crossorigin` es obligatorio aunque
         sean del mismo origen: las fuentes se piden siempre en modo CORS
         anonimo, y sin el atributo el navegador las descarga dos veces.
         JetBrains Mono NO se precarga: solo la usa el kicker, texto chico
         que puede esperar el swap. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="<%= require('@/assets/fonts/space-grotesk-variable.woff2') %>">
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="<%= require('@/assets/fonts/inter-variable.woff2') %>">

    <!-- El retrato del hero NO se precarga, y es una decision medida.

         Es el elemento LCP y solo se descubre cuando la vista ya monto, asi
         que precargarlo parece obvio. Se probo, en 4G simulada con CPU 4x:

           sin preload   retrato 2191 -> 2498 ms    LCP 2532 ms
           con preload   retrato  175 ->  711 ms    LCP 3092 ms

         La imagen llega antes y el LCP EMPEORA 560 ms. La razon es que el
         cuello de botella nunca fue la imagen sino la cadena de JavaScript
         —chunk-vendors tarda 1356 ms en bajar—, y el preload le roba ancho de
         banda justo a eso. El retrato termina esperando igual, pero ahora la
         vista tambien. -->

    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="description" content="Frontend Developer especializado en interfaces modernas con Vue, Flutter y Dart. Proyectos reales, stack usado y cómo contactarme.">
    <link rel="canonical" href="https://marcecode.com/">

    <!-- Tarjeta de previsualización (NFR-20).

         Estas etiquetas son ESTATICAS y no las toca el router, a diferencia
         del <title> y la description por ruta (D11). No es una
         inconsistencia: los rastreadores de LinkedIn, WhatsApp y Twitter NO
         ejecutan JavaScript — piden el HTML, leen las metaetiquetas del
         documento inicial y se van. Cualquier etiqueta og: que Vue insertara
         al montar es invisible para ellos.

         La consecuencia es que en una SPA sin renderizado en servidor todas
         las rutas comparten la misma tarjeta. Es una limitacion real del
         alcance —el PRD excluye backend y SSR—, no un defecto, y por eso la
         tarjeta describe EL SITIO y no una pagina.

         Las URLs van ABSOLUTAS con el dominio: ninguna plataforma resuelve
         una ruta relativa, y falla en silencio — la tarjeta sale sin imagen.

         og:image:width y og:image:height no son decorativas: sin ellas
         algunas plataformas, LinkedIn entre ellas, tienen que descargar la
         imagen para conocer sus dimensiones antes de decidir el layout, y si
         la descarga tarda muestran la tarjeta sin imagen. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marcecode.com/">
    <meta property="og:site_name" content="MarceCode">
    <meta property="og:title" content="Marcelo Olivera — Frontend Developer">
    <meta property="og:description" content="Construyo interfaces que se sienten tan bien como se ven — web, mobile y escritorio. Proyectos reales con Vue, Flutter y Node.js.">
    <meta property="og:image" content="https://marcecode.com/og-image.webp">
    <meta property="og:image:type" content="image/webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Marcelo Olivera, Frontend Developer">
    <meta property="og:locale" content="es_AR">
    <meta property="og:locale:alternate" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Marcelo Olivera — Frontend Developer">
    <meta name="twitter:description" content="Construyo interfaces que se sienten tan bien como se ven — web, mobile y escritorio. Proyectos reales con Vue, Flutter y Node.js.">
    <meta name="twitter:image" content="https://marcecode.com/og-image.webp">
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
