<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- Tema antes del primer pintado. Va ANTES de toda hoja de estilo y sin
         defer ni async: tiene que bloquear. Si el tema se aplicara al montar
         la app, todo visitante con preferencia clara veria un destello oscuro,
         y ese destello cuenta como cambio de layout percibido.

         El try/catch no es decorativo: en modo privado de Safari el mero
         acceso a localStorage LANZA, y una excepcion en un script bloqueante
         dejaria la pagina sin tema y sin aplicacion.

         La clave `mc-theme` tiene que ser identica a la de useTheme.js. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('mc-theme'); } catch (e) { /* noop */ }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!-- Fuentes del hero, precargadas. `crossorigin` es obligatorio aunque
         sean del mismo origen: las fuentes se piden siempre en modo CORS
         anonimo, y sin el atributo el navegador las descarga dos veces.
         JetBrains Mono NO se precarga: solo la usa el kicker, texto chico
         que puede esperar el swap. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="<%= require('@/assets/fonts/space-grotesk-variable.woff2') %>">
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="<%= require('@/assets/fonts/inter-variable.woff2') %>">

    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
