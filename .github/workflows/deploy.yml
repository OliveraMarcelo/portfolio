name: Deploy a producción

on:
  push:
    branches: [main]
  # Permite relanzar el deploy desde la interfaz de GitHub sin necesidad de un
  # commit vacio.
  workflow_dispatch:

jobs:
  # ─── Build imagen Docker y push a Docker Hub ─────────────────────────────
  build-and-push:
    name: Build & Push → Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push portfolio
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}

  # ─── Copiar docker-compose al servidor ───────────────────────────────────
  copy-config:
    name: Copiar config → servidor
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: /opt/portfolio

  # ─── Deploy al servidor vía SSH ──────────────────────────────────────────
  deploy:
    name: Deploy → DigitalOcean
    needs: copy-config
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          LE_EMAIL: ${{ secrets.LE_EMAIL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,LE_EMAIL
          command_timeout: 5m
          script: |
            set -e

            # Instalar certbot si no está
            if ! command -v certbot &>/dev/null; then
              apt-get update -qq && apt-get install -y certbot
            fi

            # El certificado se pide si NO EXISTE o si le quedan menos de 30 dias.
            #
            # Antes la condicion era solo la existencia del archivo, y por eso
            # el sitio estuvo sirviendo una copia vieja: el certificado vencio
            # el 31 de julio de 2026, el archivo seguia ahi, el deploy lo
            # saltaba, y Cloudflare —que valida el origen— dejaba de poder
            # conectarse y servia contenido cacheado del 10 de mayo. Desde
            # afuera se veia un 200 normal, porque el certificado que valida el
            # navegador es el de Cloudflare, no el nuestro.
            NECESITA_CERT=0
            if [ ! -f "/etc/letsencrypt/live/marcecode.com/fullchain.pem" ]; then
              echo "No hay certificado: se pide uno nuevo."
              NECESITA_CERT=1
            elif ! openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -checkend 2592000 >/dev/null 2>&1; then
              echo "El certificado vence en menos de 30 dias: se renueva."
              openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -dates | sed 's/^/  /'
              NECESITA_CERT=1
            else
              echo "Certificado vigente:"
              openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -enddate | sed 's/^/  /'
            fi

            if [ "$NECESITA_CERT" = "1" ]; then
              # standalone necesita el puerto 80, que el propio container ocupa
              docker ps -q --filter "publish=80" | xargs -r docker stop
              docker compose -f /opt/portfolio/docker-compose.prod.yml down 2>/dev/null || true

              # El fallo de la renovacion NO puede tumbar el deploy: con `set -e`
              # el script cortaba justo despues del `down`, y el sitio quedaba
              # sin container. Un certificado vencido es un problema; dejar el
              # servidor apagado es peor.
              if certbot certonly --standalone \
                   -d marcecode.com \
                   --email $LE_EMAIL \
                   --agree-tos \
                   --no-eff-email \
                   --non-interactive; then
                echo "Certificado renovado:"
                openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -dates | sed 's/^/  /'
              else
                echo "AVISO: no se pudo renovar el certificado. El deploy sigue."
                echo "El desafio HTTP-01 no puede funcionar con el proxy de"
                echo "Cloudflare activo: Let's Encrypt pide"
                echo "  http://marcecode.com/.well-known/acme-challenge/..."
                echo "y Cloudflare responde con su copia cacheada del sitio en"
                echo "lugar de reenviar el pedido al origen. Se necesita una de"
                echo "estas tres, y las tres se hacen en el panel de Cloudflare:"
                echo "  1. un Origin Certificate de Cloudflare (dura 15 anios,"
                echo "     no se renueva nunca mas)"
                echo "  2. el desafio DNS-01 con un token de API"
                echo "  3. desactivar el proxy (nube gris) el rato que dura la"
                echo "     renovacion"
              fi
            fi

            # Renovacion automatica. El cron anterior corria `certbot renew` a
            # secas: standalone necesita el puerto 80 y el container lo ocupa,
            # asi que la renovacion venia fallando en silencio desde que el
            # stack pasa a publicar los puertos directo. De ahi que el
            # certificado llegara a vencerse.
            #
            # Los hooks bajan y suben el stack alrededor de la renovacion.
            crontab -l 2>/dev/null | grep -v 'certbot renew' | crontab - 2>/dev/null || true
            (crontab -l 2>/dev/null; echo "0 3 * * * certbot renew --quiet --standalone --pre-hook 'docker compose -f /opt/portfolio/docker-compose.prod.yml down' --post-hook 'docker compose -f /opt/portfolio/docker-compose.prod.yml up -d'") | crontab -

            cd /opt/portfolio

            echo "──── estado antes del deploy ────"
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            # Se lee ANTES de recrear el container: despues su log esta vacio
            # por construccion, y leerlo ahi no dice nada.
            #
            # Si Cloudflare estuviera enviando el trafico de marcecode.com a
            # ESTE servidor, su log de acceso tendria las peticiones. Si no
            # aparecen, el origen configurado en Cloudflare es otra maquina, y
            # por eso el sitio publico no cambia aunque el deploy salga verde.
            #
            # Fue exactamente lo que paso el 2026-08-18: se pidieron cinco URLs
            # marcadas contra el dominio publico y NINGUNA llego a este
            # servidor. El container solo vio las dos peticiones que hace este
            # propio script.
            #
            # No se imprime ninguna IP del servidor: solo se clasifica lo que
            # entra, para no exponer el origen en un log publico.
            echo "──── trafico que recibio el servidor ────"
            LOG=$(docker compose -f docker-compose.prod.yml logs --tail 400 --no-log-prefix portfolio 2>/dev/null || true)
            printf "  lineas de acceso: %s\n" "$(printf '%s' "$LOG" | grep -cE '"(GET|HEAD|POST)' || true)"
            printf "  origenes distintos: %s\n" "$(printf '%s' "$LOG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | sort -u | wc -l)"
            printf "  ultimas rutas pedidas:\n"
            printf '%s' "$LOG" | grep -oE '"(GET|HEAD) [^ ]+' | tail -8 | sed 's/^/    /' || true

            docker compose -f docker-compose.prod.yml pull portfolio

            # `--remove-orphans` no es cosmetico. El compose anterior tenia un
            # servicio `nginx` haciendo de proxy inverso que ocupaba los puertos
            # 80 y 443, con `portfolio` detras y sin publicar puertos. El compose
            # actual saco el proxy y publica `portfolio` directo.
            #
            # Compose NO borra los servicios que desaparecen del archivo: los deja
            # como huerfanos, corriendo. Resultado: el proxy viejo seguia sirviendo
            # el sitio anterior y el container nuevo no podia tomar los puertos.
            # El deploy reportaba exito y en produccion no cambiaba nada.
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d

            # A partir de aca el stack tiene que quedar arriba pase lo que pase:
            # cualquier salida por error levanta el container antes de irse.
            trap 'docker compose -f /opt/portfolio/docker-compose.prod.yml up -d || true' EXIT

            echo "──── estado despues del deploy ────"
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            # El deploy no puede darse por bueno sin comprobar que el sitio
            # responde con la version que se acaba de publicar. Antes decia
            # "Deploy exitoso" sin verificar nada.
            echo "──── certificado que presenta el origen ────"
            # Si el certificado esta vencido, Cloudflare en modo Full (strict)
            # RECHAZA la conexion al origen y sirve una copia vieja. Desde
            # afuera se ve un 200 normal, porque el certificado que valida el
            # navegador es el de Cloudflare, no el nuestro.
            #
            # Ojo con el metodo: verificar con `curl -k` desde el propio
            # servidor NO detecta esto, porque -k saltea justamente la
            # validacion que Cloudflare si hace.
            openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -dates -subject 2>&1 | sed 's/^/  /' || echo "  (no se pudo leer el certificado)"
            printf "  vencido? "
            if openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -checkend 0 >/dev/null 2>&1; then
              echo "no, sigue vigente"
            else
              echo "SI — Cloudflare no puede validar el origen"
            fi

            echo "──── handshake TLS contra el propio origen, validando ────"
            curl -s -o /dev/null -w "  con validacion: %{http_code} (%{ssl_verify_result})\n" \
              --resolve marcecode.com:443:127.0.0.1 https://marcecode.com/ 2>&1 || echo "  la conexion validada FALLA"

            echo "──── que devuelve el dominio publico vs este servidor ────"
            printf "  desde este servidor:  %s\n" "$(curl -sk https://localhost/ -H 'Host: marcecode.com' | grep -o '<title>[^<]*</title>' || echo '(sin respuesta)')"
            printf "  desde el dominio:     %s\n" "$(curl -s https://marcecode.com/ | grep -o '<title>[^<]*</title>' || echo '(sin respuesta)')"

            echo "──── verificando el sitio ────"
            rm -f /tmp/publicado.html
            # SIN -k, y resolviendo el dominio contra el propio servidor: es la
            # misma validacion que hace Cloudflare. Con -k, un certificado
            # vencido pasaba el chequeo y el deploy se daba por bueno mientras
            # el sitio publico servia una copia de hace tres meses.
            for i in $(seq 1 15); do
              if curl -sf --resolve marcecode.com:443:127.0.0.1 https://marcecode.com/ -o /tmp/publicado.html; then break; fi
              sleep 2
            done

            if [ ! -s /tmp/publicado.html ]; then
              echo "FALLO: el origen no acepta una conexion TLS validada."
              echo "Cloudflare tampoco va a poder, y va a servir contenido viejo."
              openssl x509 -in /etc/letsencrypt/live/marcecode.com/fullchain.pem -noout -dates | sed 's/^/  /' || true
              exit 1
            fi

            if grep -q '<title>Marcelo Olivera' /tmp/publicado.html; then
              echo "OK: el sitio responde con la version nueva, con TLS validado"
            else
              echo "FALLO: el sitio responde, pero no con la version esperada"
              echo "titulo servido:"; grep -o '<title>[^<]*</title>' /tmp/publicado.html || echo '(sin title)'
              docker compose -f docker-compose.prod.yml logs --tail 40 portfolio
              exit 1
            fi

            docker image prune -f
