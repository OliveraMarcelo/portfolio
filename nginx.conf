server {
    listen 80;
    server_name marcecode.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name marcecode.com;

    ssl_certificate     /etc/letsencrypt/live/marcecode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marcecode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Las coincidencias exactas (=) ganan sobre las de expresion regular en
    # nginx, sin importar el orden. Hacen falta las dos: sin ellas,
    # service-worker.js cae en el bloque de abajo y se cachea UN AÑO, con lo
    # cual el navegador no se entera nunca de que hay una version nueva y el
    # aviso de actualizacion no se dispara jamas.
    #
    # `no-cache` NO es `no-store`: permite cachear pero obliga a revalidar
    # antes de usar la copia. La respuesta 304 es barata y garantiza que nunca
    # se sirva un index.html viejo apuntando a bundles que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Estos si llevan el nombre con hash del contenido: si el archivo cambia,
    # cambia la URL. Un año inmutable es lo correcto.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # La CSP es viable porque el sitio no pide nada a ningun host externo
    # (D14): se fueron Google Fonts, el worker de PDF.js y Font Awesome.
    #
    # Los dos 'unsafe-inline' son necesarios y no un descuido: el de
    # script-src por el script inline de tema e idioma que corre antes del
    # primer pintado (D2), y el de style-src por los estilos inline que Vue
    # emite. Sin ellos el sitio se rompe.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
